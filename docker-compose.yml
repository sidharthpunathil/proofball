# Local Postgres for ProofBall — a materialized cache of the TxLINE World Cup
# feed's FINISHED matches (immutable knockout results). Runs on a deliberately
# odd port (55432) so it never collides with a system Postgres on 5432.
#
#   docker compose up -d        # start
#   npm run matches:sync        # populate from the live TxLINE feed
#   docker compose down         # stop (data persists in the named volume)
services:
  db:
    image: postgres:16-alpine
    container_name: proofball-pg
    restart: unless-stopped
    ports:
      # Bind to loopback only — never publish the DB on 0.0.0.0 (Docker's iptables
      # would bypass the host firewall). The app connects via localhost:55432.
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: proofball
      # Override with a strong password on any shared/remote host: POSTGRES_PASSWORD=… in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofball}
      POSTGRES_DB: proofball
    volumes:
      - proofball_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofball -d proofball"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared state for multi-user scale: the global leaderboard (ZSET) and a
  # cross-instance cache of the TxLINE fixtures/odds feed. Odd port 63799 so it
  # never collides with a local Redis on 6379.
  redis:
    image: redis:7-alpine
    container_name: proofball-redis
    restart: unless-stopped
    environment:
      # Set REDIS_PASSWORD in .env to require auth. Empty (default) keeps the current
      # no-auth local-dev behavior. `$$` escapes compose interpolation so the shell
      # in the container expands it: --requirepass is added only when a password is set.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: sh -c 'redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    ports:
      # Loopback only (see db note above). App connects via localhost:63799.
      - "127.0.0.1:63799:6379"
    volumes:
      - proofball_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  proofball_pg:
  proofball_redis:
